<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Votre code de connexion TECHNOVA</title>
</head>
<body style="margin: 0; padding: 0; background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #ffffff; padding: 60px 20px;">
    <tr>
      <td align="center">
        <!-- Main Card -->
        <table width="100%" max-width="500" cellpadding="0" cellspacing="0" style="margin: 0 auto; max-width: 500px; background-color: #ffffff;">
          
          <!-- Logo Header -->
          <tr>
            <td align="center" style="padding-bottom: 40px;">
              <!-- Tu pourras remplacer cette balise img par l'URL de ton vrai logo quand il sera en ligne -->
              <div style="color: #2563eb; font-size: 32px; font-weight: 900; margin: 0; line-height: 1; letter-spacing: -1px; text-transform: uppercase;">
                TECHNOVA
              </div>
            </td>
          </tr>
          
          <!-- Body Text -->
          <tr>
            <td style="padding: 0 0 30px 0; text-align: left;">
              <p style="margin: 0 0 20px 0; color: #4b5563; font-size: 16px;">
                Bonjour,
              </p>
              <p style="margin: 0; color: #4b5563; font-size: 16px;">
                Voici votre code de connexion pour accéder à vos achats :
              </p>
            </td>
          </tr>
          
          <!-- OTP Code Box -->
          <tr>
            <td align="center" style="padding-bottom: 30px;">
              <div style="background-color: #f4f4f5; border-radius: 12px; padding: 30px 20px; width: 100%; max-width: 350px; text-align: center;">
                <span style="font-family: monospace; font-size: 42px; font-weight: bold; color: #18181b; letter-spacing: 12px;">{{ .Token }}</span>
              </div>
            </td>
          </tr>
          
          <!-- Expiration info -->
          <tr>
            <td align="center" style="padding-bottom: 40px;">
              <p style="margin: 0; color: #71717a; font-size: 15px;">
                Ce code expire dans 10 minutes.
              </p>
            </td>
          </tr>
          
          <!-- Separator Line -->
          <tr>
            <td align="center" style="padding-bottom: 30px;">
              <hr style="border: none; border-top: 1px solid #e4e4e7; width: 100%; margin: 0;" />
            </td>
          </tr>
          
          <!-- Footer -->
          <tr>
            <td align="center">
              <p style="margin: 0; color: #a1a1aa; font-size: 14px;">
                Si vous n'avez pas demandé ce code, ignorez cet email.
              </p>
            </td>
          </tr>
          
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
